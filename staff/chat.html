<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting To Secure Chat - Staff Dashboard | World University of Bangladesh (WUB)</title>
    <meta http-equiv="refresh" content="0; url=dashboard.html">
    <link rel="icon" type="image/x-icon" href="../favicon.ico?v=20260222">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, sans-serif;
            background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
            color: #0f172a;
        }

        .redirect-card {
            width: min(480px, calc(100vw - 32px));
            padding: 32px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.4rem;
        }

        p {
            margin: 0;
            color: #475569;
            line-height: 1.6;
        }
    </style>
    <script>
        window.location.replace(`dashboard.html${window.location.search}${window.location.hash}`);
    </script>
</head>

<body>
    <div class="redirect-card">
        <h1>Opening secure handover chat...</h1>
        <p>You are being redirected to the staff dashboard where the floating chat widget will open automatically.</p>
    </div>
</body>

</html>
