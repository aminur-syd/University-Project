<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs - Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 74px);
        }

        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--text-color);
            font-weight: 500;
            transition: var(--transition);
            gap: 10px;
        }

        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background-color: #f3f4f6;
            color: var(--primary-color);
            border-right: 3px solid var(--primary-color);
        }

        .logs-container {
            background: #1f2937;
            color: #10b981;
            padding: 20px;
            border-radius: var(--border-radius);
            font-family: monospace;
            max-height: 500px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">Lost <span style="color: #fca311;">&</span> <span
                    style="color: var(--secondary-color);">Found</span> <span
                    style="font-size: 0.8rem; background: var(--danger); color: white; padding: 2px 6px; border-radius: 4px; vertical-align: middle;">ADMIN</span></a>
            <div class="nav-links">
                <span style="font-weight: 600;">Welcome, <span id="user-name">Admin</span></span>
                <button id="logout-btn" class="btn btn-outline"
                    style="color: var(--text-color); border-color: var(--text-color);">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="manage-users.html"><i class="fas fa-users-cog"></i> Manage Users</a></li>
                <li><a href="logs.html" class="active"><i class="fas fa-history"></i> System Logs</a></li>
                <li><a href="../staff/review-posts.html"><i class="fas fa-check-square"></i> Review Posts</a></li>
                <li><a href="../staff/review-claims.html"><i class="fas fa-gavel"></i> Review Claims</a></li>
                <li><a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2>System Logs</h2>
            <div class="logs-container" id="logs-container">
                <div class="log-entry">Loading system logs...</div>
            </div>
        </main>
    </div>

    <script type="module" src="../assets/js/firebase-config.js"></script>
    <script type="module" src="../assets/js/auth.js"></script>
    <script type="module" src="../assets/js/admin.js"></script>
</body>

</html>
