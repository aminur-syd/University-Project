<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Lost & Found</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .auth-box {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: var(--border-radius);
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Lost & Found</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join to report or claim items</p>
            </div>
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                    <div class="validation-message" id="name-error"></div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                    <div class="validation-message" id="email-error"></div>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" required>
                    <div class="validation-message" id="phone-error"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                    <ul class="password-requirements" id="password-requirements">
                        <li id="req-length"><i class="fas fa-circle"></i> At least 6 characters</li>
                        <li id="req-capital"><i class="fas fa-circle"></i> One capital letter</li>
                        <li id="req-number"><i class="fas fa-circle"></i> One number</li>
                    </ul>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" class="form-control" required>
                    <div class="validation-message" id="address-error"></div>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="city">City</label>
                        <input type="text" id="city" class="form-control" required>
                        <div class="validation-message" id="city-error"></div>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="zip">Zip Code</label>
                        <input type="text" id="zip" class="form-control" required>
                        <div class="validation-message" id="zip-error"></div>
                    </div>
                </div>
                <div class="error-message" id="register-error"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>
            <div style="text-align: center; margin: 20px 0;">
                <p>OR</p>
                <button id="google-btn" class="btn btn-google"
                    style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <i class="fab fa-google"></i> Sign up with Google
                </button>
            </div>
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" style="color: var(--primary-color);">Login here</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
</body>

</html>
