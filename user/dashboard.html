<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Lost & Found</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 74px);
        }

        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--text-color);
            font-weight: 500;
            transition: var(--transition);
            gap: 10px;
        }

        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background-color: #f3f4f6;
            color: var(--primary-color);
            border-right: 3px solid var(--primary-color);
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-info h3 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .stat-info p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .stat-icon {
            font-size: 2rem;
            color: #d1d5db;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">Lost & Found</a>
            <div class="nav-links">
                <span style="font-weight: 600;">Welcome, <span id="user-name">User</span></span>
                <button id="logout-btn" class="btn btn-outline"
                    style="color: var(--text-color); border-color: var(--text-color);">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="active"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="create-post.html"><i class="fas fa-plus-circle"></i> Post Item</a></li>
                <li><a href="my-posts.html"><i class="fas fa-list"></i> My Posts</a></li>
                <li><a href="my-claims.html"><i class="fas fa-hand-holding"></i> My Claims</a></li>
                <li><a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2>Dashboard Overview</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="stat-posts">0</h3>
                        <p>Total Posts</p>
                    </div>
                    <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="stat-claims">0</h3>
                        <p>Active Claims</p>
                    </div>
                    <div class="stat-icon"><i class="fas fa-hand-paper"></i></div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="stat-resolved">0</h3>
                        <p>Resolved Items</p>
                    </div>
                    <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                </div>
            </div>

            <div class="recent-activity">
                <h3>Recent Activity</h3>
                <div
                    style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-top: 10px;">
                    <p style="color: var(--text-light); text-align: center;">No recent activity.</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../assets/js/firebase-config.js"></script>
    <script type="module" src="../assets/js/auth.js"></script>
    <script>
        // Check auth state
        import { auth } from '../assets/js/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-name').textContent = user.displayName || user.email.split('@')[0];
            } else {
                window.location.href = '../login.html';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = '../index.html');
        });
    </script>
</body>

</html>
